schema_version: 1
project: example-project
governance:
  public_reference_authority: false
  required_mode: fail-closed
project_truth:
  golden_paths:
    - describe critical behavior that must not regress
  security_boundaries:
    - describe auth, tenancy, data, or integration boundaries
  performance_targets:
    - describe device/server/latency constraints
validation:
  required:
    - focused regression tests
    - governance validation
    - independent review for material risk
