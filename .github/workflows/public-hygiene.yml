name: Governance reference validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate public repository scope
        run: python scripts/validate_public_lab.py
      - name: Validate agent control harness
        run: python scripts/validate_agent_controls.py
      - name: Bounded recovery self-check
        run: python scripts/governance_recovery.py
      - name: Capability doctor self-check
        run: python scripts/capability_doctor.py --require python --require AGENTS.md
      - name: Validate completed Spec Kit fixture
        run: |
          python scripts/spec_check.py examples/specs/001-capability-contract
          python scripts/unlazy_check.py examples/specs/001-capability-contract
      - name: Reference harness tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Python syntax
        run: python -m py_compile scripts/validate_public_lab.py scripts/validate_agent_controls.py scripts/capability_doctor.py scripts/evaluate_action.py scripts/spec_check.py scripts/unlazy_check.py scripts/compile_context.py scripts/governance_recovery.py scripts/audit_fingerprint.py
      - name: JSON parse
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=(list(Path('schemas').glob('*.json'))+list(Path('examples').glob('*.json'))+
                 list(Path('control').glob('*.json'))+[Path('.agents/manifest.json')])
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
          print(f'PASS: parsed {len(files)} JSON files')
          PY
      - name: Audit fingerprint smoke check
        run: python scripts/audit_fingerprint.py AGENTS.md .agents/manifest.json .specify/memory/constitution.md
      - name: Reject obvious secret/non-public artifact patterns
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \
            \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '*.sqlite' -o -name '*.db' \) \
            -not -path './.git/*' | grep -q .; then
            echo 'Forbidden secret/non-public artifact pattern found.' >&2
            exit 1
          fi
      - name: Whitespace check
        run: git diff --check
