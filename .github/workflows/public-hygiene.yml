name: Governance reference validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate public/private boundary
        run: python scripts/validate_public_lab.py
      - name: Validate agent control harness
        run: python scripts/validate_agent_controls.py
      - name: Python syntax
        run: python -m py_compile scripts/validate_public_lab.py scripts/validate_agent_controls.py
      - name: JSON parse
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('schemas').glob('*.json'))+list(Path('examples').glob('*.json'))+[Path('.agents/manifest.json')]
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
          print(f'PASS: parsed {len(files)} JSON files')
          PY
      - name: Reject obvious secret/private-file patterns
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \
            \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '*.sqlite' -o -name '*.db' \) \
            -not -path './.git/*' | grep -q .; then
            echo 'Forbidden secret/private artifact pattern found.' >&2
            exit 1
          fi
      - name: Whitespace check
        run: git diff --check
